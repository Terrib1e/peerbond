# Production Docker Compose for PeerBond Orchestration System
version: '3.8'

services:
  # Main API Service
  peerbond-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: peerbond/orchestration-api:3.0.0
    container_name: peerbond-api
    restart: unless-stopped
    ports:
      - "3001:3001"
      - "9464:9464"  # Prometheus metrics
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://peerbond:${DB_PASSWORD}@postgres:5432/peerbond
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN}
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 100
      LOG_LEVEL: info
      JAEGER_ENDPOINT: http://jaeger:14268/api/traces
      PROMETHEUS_PORT: 9464
      INSTANCE_ID: api-${HOSTNAME:-unknown}
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - peerbond-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.peerbond-api.rule=PathPrefix(\`/api\`)"
      - "traefik.http.services.peerbond-api.loadbalancer.server.port=3001"

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: peerbond-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: peerbond
      POSTGRES_USER: peerbond
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    networks:
      - peerbond-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peerbond -d peerbond"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: peerbond-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - peerbond-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: peerbond-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - peerbond-api
    networks:
      - peerbond-network
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: peerbond-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - peerbond-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: peerbond-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - peerbond-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'

  # Jaeger Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: peerbond-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: 9411
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Accept jaeger.thrift directly from clients
    networks:
      - peerbond-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'

  # Log Aggregation (ELK Stack - Lightweight)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.0
    container_name: peerbond-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
      - xpack.security.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - peerbond-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'

  # Backup Service
  backup:
    image: postgres:15-alpine
    container_name: peerbond-backup
    restart: "no"
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    depends_on:
      - postgres
    networks:
      - peerbond-network
    command: /bin/sh -c "chmod +x /backup.sh && /backup.sh"
    profiles:
      - backup

# Networks
networks:
  peerbond-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Volumes
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local