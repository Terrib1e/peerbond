# Prometheus configuration for PeerBond Orchestration monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'peerbond-production'
    replica: 'primary'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them
rule_files:
  - "alert_rules.yml"

# Scrape configurations
scrape_configs:
  # PeerBond API metrics
  - job_name: 'peerbond-api'
    static_configs:
      - targets: ['peerbond-api:9464']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    honor_labels: true
    params:
      format: ['prometheus']

  # PeerBond health endpoint
  - job_name: 'peerbond-health'
    static_configs:
      - targets: ['peerbond-api:3001']
    metrics_path: '/health'
    scrape_interval: 30s
    scrape_timeout: 10s

  # PostgreSQL metrics (using postgres_exporter)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  # Redis metrics (using redis_exporter)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s

  # Node metrics (system level)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s

  # Nginx metrics
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
    scrape_interval: 30s

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s

  # Grafana metrics
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    metrics_path: '/metrics'
    scrape_interval: 30s

# Recording rules for aggregated metrics
recording_rules:
  - name: peerbond_orchestration_rules
    interval: 30s
    rules:
      # Request rate
      - record: peerbond:http_requests:rate5m
        expr: rate(http_request_duration_ms_count[5m])
      
      # Error rate
      - record: peerbond:http_errors:rate5m
        expr: rate(http_request_duration_ms_count{status_class="5xx"}[5m])
      
      # Average response time
      - record: peerbond:http_request_duration:avg5m
        expr: rate(http_request_duration_ms_sum[5m]) / rate(http_request_duration_ms_count[5m])
      
      # Session metrics
      - record: peerbond:sessions:active
        expr: orchestration_active_sessions
      
      # Crisis alert rate
      - record: peerbond:crisis_alerts:rate1h
        expr: rate(orchestration_crisis_alerts_total[1h])
      
      # Agent usage distribution
      - record: peerbond:agent_calls:rate5m_by_agent
        expr: rate(orchestration_agent_calls_total[5m]) by (agent_name)

# Global configuration
global:
  # How frequently to scrape targets by default
  scrape_interval: 15s
  
  # How long until a scrape request times out
  scrape_timeout: 10s
  
  # How frequently to evaluate rules
  evaluation_interval: 15s

# Storage configuration
storage:
  tsdb:
    retention.time: 30d
    retention.size: 10GB
    wal-compression: true